services:
  metrics-source:
    image: alpine:latest
    volumes:
      - ../../report/input_forward_prometheus_metrics_source:/usr/local/bin/metrics-source:ro
    command: ["/usr/local/bin/metrics-source"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:18080/metrics"]
      interval: 2s
      timeout: 2s
      retries: 15
  prometheus:
    image: prom/prometheus:v2.45.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5
